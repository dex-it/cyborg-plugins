# Обновление зависимостей: npm (корень со скриптами и сайт документации) и действия GitHub Actions.
# Раз в неделю, не больше пяти открытых PR на каталог; минорные и патч-обновления одной группы идут одним PR,
# мажорные приходят отдельными PR и принимаются ревью.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    # TypeScript 7 ломает npm ci сайта (@astrojs/check требует typescript ^5 || ^6): мажор не предлагаем.
    ignore:
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      actions:
        patterns: ['*']
